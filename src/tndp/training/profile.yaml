common:
  symmetric_routes: true
model:
  route_generator:
    type: PathCombiningRouteGenerator
    kwargs:
      n_halt_heads: 4
      feature_norm_unbiased: true
      use_redundancy_features: false
      temperature: 1
      fixed_frequency_Hz: 0.00074
      only_routes_with_demand_are_valid: false
      logit_clip: null
      n_nodepair_layers: 3
      n_pathscorer_layers: 3
      pathscorer_hidden_dim: 16
      n_halt_layers: 3
      halt_scorer_type: endpoints
      serial_halting: true
  features:
    name: construction_holliday
    node:
    - node.x
    - node.y
    - node.x_scaled
    - node.y_scaled
    pair:
    - demand
    - route.direct
    - route.direct_time
    - street.exists
    - street.time
    - network.has_path
    - network.transit_time
    - network.one_transfer
    - network.two_transfers
    - node.same
    - pref.ATT
    - pref.RTT
    - street.drive_time
    global_features:
    - pref.ATT
    - pref.RTT
    - network.route_time
    - routes.finished_log
    - routes.left_log
    - routes.finished_fraction
    - routes.left_fraction
    - demand.disconnected_log
    - demand.disconnected_fraction
    - route.n_stops
    - demand.served_time
    extend:
    - path.drive_time
    - path.n_stops
    - route.drive_time
    - route.n_stops
    halt:
    - route.drive_time
    - route.n_stops
    trim:
    - trim.removed_fraction
    - trim.remaining_fraction
    - route.length_fraction
    - trim.removed_time_fraction
    - trim.remaining_time_fraction
    - trim.direction
    - trim.removed_node_overlap
    - trim.removed_node_unique
    - trim.removed_edge_overlap
    - trim.removed_edge_unique
    - trim.kept_node_overlap
    - trim.kept_node_unique
    - trim.kept_edge_overlap
    - trim.kept_edge_unique
    critic:
    - graph.total_demand
    - graph.demand_edges
    - graph.mean_demand
    - graph.std_demand
    - graph.weighted_time_mean
    - graph.weighted_time_std
    - graph.node_x_mean
    - graph.node_y_mean
    - graph.node_x_scaled_mean
    - graph.node_y_scaled_mean
    - pref.ATT
    - pref.RTT
    - network.route_time
    - routes.finished_log
    - routes.left_log
    - routes.finished_fraction
    - routes.left_fraction
    - demand.disconnected_log
    - demand.disconnected_fraction
    - route.n_stops
    - demand.served_time
  common:
    dropout: 0.0
    nonlin_type: ReLU
    embed_dim: 64
  backbone_gn:
    net_type: graph attn
    kwargs:
      n_layers: 5
      use_norm: false
      n_heads: 4
      dense: false
      recurrent: false
      residual: false
      n_proj_layers: 1
      out_dim: null
      layer_kwargs: {}
cost:
  low_memory_mode: false
  kwargs:
    mean_stop_time_s: 0
    avg_transfer_wait_time_s: 300.0
    demand_time_weight: 0.8
    route_time_weight: 0.19999999999999996
    median_connectivity_weight: 0.0
    ignore_stops_oob: true
    adjustment_degree_target: 0.2
    adjustment_degree_objective: raw
    objectives:
    - ATT
    - RTT
    penalties:
      constraints: 5.0
      adjustment: 0.0
      edit_step: 0.0
      forced_halt: 0.0
    monitor:
    - ATT
    - RTT
    - WMC
    - d0
    - d1
    - d2
    - d_un
    - n_disconnected
env:
  params:
    diff_reward: true
    reward_scale: 1.0
    force_linking_unlinked: false
    max_act_len: null
preferences:
  objectives:
  - ATT
  - RTT
  demand_time_weight: 0.8
  route_time_weight: 0.19999999999999996
  median_connectivity_weight: 0.0
  variable_weights: true
  pp_fraction: 0.33
  op_fraction: 0.33
  mcw_fraction: 0.0
dataset:
  train_pipeline:
    space_scale: 0.6
    demand_scale: 0.2
    flip: true
    rotate: 180
    edit_features: false
  evaluation_pipeline:
    space_scale: 0
    demand_scale: 0
    flip: false
    rotate: 0
    edit_features: false
algorithm:
  name: ppo
  gamma: 1.0
  epsilon: 0.2
  use_gae: true
  gae_lambda: 0.95
  n_epochs: 1
  minibatch_size: 128
  entropy_weight: 0.0
  normalize_advantages: true
  diversity_weight: 0.0
  diversity_alpha: 1.0
  preference_noise_sigma: 0.15
  max_grad_norm: 0.5
  gradient_diagnostics_interval: 0
  diversity_detach_neighbor: false
  diversity_reduction: state_mean
  critic:
    learning_rate: 0.0005
    decay: 0.01
    shared: false
    unbiased: true
    normalize_returns: false
    huber: false
    huber_delta: 1.0
    value_clip: null
    return_norm_momentum: 0.05
    feature_norm_momentum: 0.001
    n_layers: 3
    width_multiplier: 2
    dropout: 0.0
optimizer:
  name: Adam
  learning_rate: 0.0016
  decay: 0.0008404361781997002
evaluation:
  validation_mode: sample
  graph_count: null
  pareto_graph_count: 64
  test_graph_count: 64
  pareto_enabled: false
  pareto_period: 50
  pareto_preference_count: 11
  pareto_stochastic_samples: 1
  hv_reference:
  - 3.0
  - 3.0
  eu_preference_count: 101
  preference_count: 11
  stochastic_samples: 1
  seed: 9001
  final_test: false
train_loop:
  n_iterations: 200
  horizon: 120
  val_period: 10
  validate_before_update: true
  max_seconds: null
  batch_size: 32
  batch_size_cuda: 32
  cpu_threads: 2
  warmup_batches: 0
  max_rollout_samples: null
  calibrate_before_validation: false
  action_seed: null
  force_nonhalt_until: null
  resample_preferences_on_terminal: false
  preference_distribution: sampler
