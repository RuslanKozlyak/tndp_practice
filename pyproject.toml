[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tndp-teaching"
version = "0.1.0"
description = "A small GA, RL and GA+RL playground for transit network design"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "networkx>=3,<4",
    "torch>=2.8,<3",
    "torch-geometric>=2.6,<3",
    "omegaconf>=2.3,<2.4",
    "cloudpickle>=3,<4",
    "tensorboard>=2.18,<3",
    "matplotlib",
    "pandas",
    "ipykernel",
    "ipywidgets>=8,<9",
    "shapely>=2,<3",
    "pyproj>=3,<4",
    "contextily>=1.7,<2",
    "folium>=0.20,<2",
    "tqdm",
]

[project.optional-dependencies]
check = ["nbformat>=5", "nbclient>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tndp.training" = ["profile.yaml"]
